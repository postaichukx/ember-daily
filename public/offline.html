<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport">
    <meta content="#101112" name="theme-color">
    <title>Ember · Offline</title>
    <style>body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #101112;
        color: #f2f1ed;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif
    }

    main {
        padding: 30px;
        text-align: center;
        max-width: 360px
    }

    img {
        width: 76px;
        border-radius: 23px
    }

    h1 {
        font-size: 30px;
        letter-spacing: -1px
    }

    p {
        color: #a5a5a6;
        line-height: 1.8;
        font-size: 16px
    }

    a {
        display: inline-block;
        padding: 15px 25px;
        background: #ffad7b;
        border-radius: 12px;
        color: #27180f;
        text-decoration: none;
        font-weight: 600;
        margin-top: 15px
    }</style>
</head>
<body>
<main><img alt="Ember" src="/icon-192.png">
    <h1>A moment to reconnect.</h1>
    <p>Your routines are saved in your account. Connect to the internet to see your progress and keep your fire
        going.</p><a href="/">Try again</a></main>
</body>
</html>
